<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="820" height="560" fill="#ffffff"/>
  <rect x="210" y="20" width="400" height="50" rx="8" fill="#e6edf5" stroke="#5b7aa8" stroke-width="2"/>
  <text x="410" y="49" text-anchor="middle" font-weight="bold" fill="#22303f">当前读 SQL（FOR UPDATE / UPDATE / DELETE）</text>

  <path d="M410 70 L410 100" stroke="#8aa2bf" stroke-width="2"/>
  <rect x="210" y="100" width="400" height="50" rx="8" fill="#ffffff" stroke="#8aa2bf" stroke-width="1.5"/>
  <text x="410" y="129" text-anchor="middle" fill="#22303f">索引定位：找到第一条满足下界的记录</text>

  <path d="M410 150 L410 180" stroke="#8aa2bf" stroke-width="2"/>
  <rect x="210" y="180" width="400" height="50" rx="8" fill="#ffffff" stroke="#8aa2bf" stroke-width="1.5"/>
  <text x="410" y="209" text-anchor="middle" fill="#22303f">逐条扫描并加临键锁（前一条记录, 当前记录]</text>

  <path d="M410 230 L410 260" stroke="#8aa2bf" stroke-width="2"/>
  <rect x="210" y="260" width="400" height="50" rx="8" fill="#ffffff" stroke="#8aa2bf" stroke-width="1.5"/>
  <text x="410" y="289" text-anchor="middle" fill="#22303f">遇到第一条超出上界的记录，加锁后停止扫描</text>

  <path d="M410 310 L410 340" stroke="#8aa2bf" stroke-width="2"/>
  <polygon points="410,340 550,380 410,420 270,380" fill="#f6e3d5" stroke="#c07a3a" stroke-width="2"/>
  <text x="410" y="384" text-anchor="middle" font-weight="bold" fill="#22303f">锁兼容？</text>

  <path d="M270 380 L190 440" stroke="#c07a3a" stroke-width="2"/>
  <rect x="60" y="440" width="260" height="64" rx="8" fill="#fbe9e7" stroke="#c07a3a" stroke-width="1.5"/>
  <text x="190" y="464" text-anchor="middle" fill="#22303f">冲突：进入等待队列</text>
  <text x="190" y="486" text-anchor="middle" fill="#44546a">死锁检测 / 1205 超时</text>

  <path d="M550 380 L630 440" stroke="#5b8a5b" stroke-width="2"/>
  <rect x="500" y="440" width="260" height="64" rx="8" fill="#e6f4e6" stroke="#5b8a5b" stroke-width="1.5"/>
  <text x="630" y="464" text-anchor="middle" fill="#22303f">继续执行</text>
  <text x="630" y="486" text-anchor="middle" fill="#44546a">提交 / 回滚时统一释放锁并唤醒等待者</text>
</svg>
