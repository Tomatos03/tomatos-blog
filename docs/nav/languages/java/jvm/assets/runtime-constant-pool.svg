<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <style>
      .title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:26px; font-weight:bold; fill:#1A1A2E; text-anchor:middle; }
      .sub { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#607D8B; text-anchor:middle; }
      .panel { fill:#FFFFFF; stroke:#E0E4E8; stroke-width:1; }
      .panel-title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:14.5px; font-weight:bold; fill:#1A1A2E; text-anchor:middle; }
      .zone-metaspace { fill:#F3EFFB; stroke:#5e35b1; stroke-width:2; }
      .zone-heap { fill:#F0F7FF; stroke:#1976d2; stroke-width:2; }
      .zone-title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:15px; font-weight:bold; fill:#4a148c; text-anchor:middle; }
      .zone-title-heap { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:15px; font-weight:bold; fill:#01579b; text-anchor:middle; }
      .entry { fill:#E3F2FD; stroke:#1976d2; stroke-width:1.5; }
      .entry-text { font-family:'Consolas','Courier New',monospace; font-size:11px; fill:#01579b; text-anchor:middle; dominant-baseline:middle; }
      .pool-box { fill:#FFFFFF; stroke:#1976d2; stroke-width:2; }
      .pool-title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:12.5px; font-weight:bold; fill:#01579b; text-anchor:middle; }
      .pool-row { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:10.5px; fill:#37474F; text-anchor:middle; dominant-baseline:middle; }
      .meta-box { fill:#FFFFFF; stroke:#90a4ae; stroke-width:1.5; }
      .meta-title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:12px; font-weight:bold; fill:#455a64; text-anchor:middle; }
      .meta-row { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:10.5px; fill:#607D8B; text-anchor:middle; }
      .table-box { fill:#FFF8E1; stroke:#f9a825; stroke-width:2; }
      .table-title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:12.5px; font-weight:bold; fill:#e65100; text-anchor:middle; }
      .table-row { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:10.5px; fill:#4e342e; text-anchor:middle; }
      .obj-box { fill:#E8F5E9; stroke:#388e3c; stroke-width:2; }
      .obj-title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:12px; font-weight:bold; fill:#1b5e20; text-anchor:middle; }
      .obj-row { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:10.5px; fill:#37474F; text-anchor:middle; }
      .heap-other { fill:#FFFFFF; stroke:#B0BEC5; stroke-width:1.5; }
      .other-title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11.5px; font-weight:bold; fill:#607D8B; text-anchor:middle; }
      .foot-note { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11px; fill:#78909c; text-anchor:middle; }
      .edge { stroke:#546e7a; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
      .edge-resolve { stroke:#d32f2f; stroke-width:2; fill:none; stroke-dasharray:6,4; marker-end:url(#arrowhead-red); }
      .edge-label { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11.5px; font-weight:bold; fill:#455a64; text-anchor:middle; }
      .edge-label-red { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11.5px; font-weight:bold; fill:#c62828; text-anchor:middle; }
      .cmp-card { fill:#FFFFFF; stroke-width:2; }
      .cmp-title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; font-weight:bold; text-anchor:start; }
      .cmp-row { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11px; fill:#374151; text-anchor:start; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546e7a"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d32f2f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#F5F7FA"/>

  <text x="600" y="40" class="title">运行时常量池 vs 字符串常量池：区别与方法区的关系</text>
  <text x="600" y="66" class="sub">运行时常量池属于方法区（每类一份）；字符串常量池在堆中（全局唯一一张表）</text>

  <!-- ===== 区块 A：类文件常量池 ===== -->
  <rect x="40" y="100" width="320" height="300" rx="12" class="panel"/>
  <text x="200" y="128" class="panel-title">类文件常量池（.class）</text>

  <rect x="60" y="145" width="280" height="34" rx="6" class="entry"/>
  <text x="200" y="162" class="entry-text">CONSTANT_Class #1 → Demo</text>
  <rect x="60" y="185" width="280" height="34" rx="6" class="entry"/>
  <text x="200" y="202" class="entry-text">CONSTANT_String #2 → "jvm"</text>
  <rect x="60" y="225" width="280" height="34" rx="6" class="entry"/>
  <text x="200" y="242" class="entry-text">CONSTANT_Methodref #3</text>
  <rect x="60" y="265" width="280" height="34" rx="6" class="entry"/>
  <text x="200" y="282" class="entry-text">CONSTANT_Fieldref #4</text>
  <rect x="60" y="305" width="280" height="34" rx="6" class="entry"/>
  <text x="200" y="322" class="entry-text">CONSTANT_Integer #5 → 100</text>

  <text x="200" y="372" class="foot-note">编译期写入，静态信息</text>

  <!-- ===== 区块 B：方法区（大容器） ===== -->
  <rect x="400" y="100" width="380" height="460" rx="12" class="zone-metaspace"/>
  <text x="590" y="128" class="zone-title">方法区（JDK 8+：元空间，本地内存）</text>

  <!-- 运行时常量池：方法区内部 -->
  <rect x="420" y="150" width="340" height="200" rx="10" class="pool-box"/>
  <text x="590" y="174" class="pool-title">运行时常量池（每类一份）</text>
  <rect x="436" y="188" width="308" height="26" rx="5" fill="#E8F5E9"/>
  <text x="590" y="201" class="pool-row">Demo 类："jvm" → 指向堆中 String 引用</text>
  <rect x="436" y="218" width="308" height="26" rx="5" fill="#E8F5E9"/>
  <text x="590" y="231" class="pool-row">Demo 类：类引用 → InstanceKlass 指针</text>
  <rect x="436" y="248" width="308" height="26" rx="5" fill="#E8F5E9"/>
  <text x="590" y="261" class="pool-row">User 类：方法引用 → Method 指针</text>
  <rect x="436" y="278" width="308" height="26" rx="5" fill="#E8F5E9"/>
  <text x="590" y="291" class="pool-row">User 类："hello" → 指向堆中 String 引用</text>
  <text x="590" y="330" class="foot-note">解析阶段：符号引用 → 直接引用（懒惰解析）</text>

  <!-- 方法区其他内容 -->
  <rect x="420" y="368" width="340" height="172" rx="10" class="meta-box"/>
  <text x="590" y="392" class="meta-title">方法区其他内容</text>
  <text x="590" y="420" class="meta-row">类元数据（InstanceKlass：字段、方法、字节码）</text>
  <text x="590" y="448" class="meta-row">静态变量（staticField）</text>
  <text x="590" y="476" class="meta-row">类型信息（父类、接口、修饰符）</text>
  <text x="590" y="504" class="meta-row">方法代码、构造函数代码</text>
  <text x="590" y="530" class="foot-note">运行时常量池只是方法区的一部分</text>

  <!-- ===== 区块 C：堆（大容器） ===== -->
  <rect x="820" y="100" width="340" height="460" rx="12" class="zone-heap"/>
  <text x="990" y="128" class="zone-title-heap">堆</text>

  <!-- 字符串常量池：堆内部 -->
  <rect x="840" y="150" width="300" height="120" rx="10" class="table-box"/>
  <text x="990" y="175" class="table-title">字符串常量池 StringTable</text>
  <text x="990" y="195" class="foot-note">全局唯一一张表（JDK 7 起在堆中）</text>
  <text x="990" y="226" class="table-row">"jvm" → String 引用</text>
  <text x="990" y="250" class="table-row">"hello" → String 引用</text>

  <!-- String 对象本体 -->
  <rect x="840" y="290" width="300" height="110" rx="10" class="obj-box"/>
  <text x="990" y="316" class="obj-title">String 对象本体（堆中创建）</text>
  <text x="990" y="344" class="obj-row">value: char[] { 'j','v','m' }</text>
  <text x="990" y="368" class="obj-row">hash、coder 等字段</text>

  <!-- 其他堆对象 -->
  <rect x="840" y="420" width="300" height="120" rx="10" class="heap-other"/>
  <text x="990" y="446" class="other-title">其他堆对象（普通对象/数组）</text>
  <text x="990" y="474" class="meta-row">堆是最大的内存区域，字符串常量池</text>
  <text x="990" y="496" class="meta-row">只是其中的一小部分</text>

  <!-- ===== 箭头 ===== -->
  <line x1="362" y1="240" x2="396" y2="240" class="edge"/>
  <text x="379" y="230" class="edge-label">类加载时拷贝</text>

  <path d="M 762 205 C 790 180, 812 178, 836 196" class="edge-resolve"/>
  <text x="800" y="168" class="edge-label-red">解析：查找/创建</text>

  <line x1="990" y1="270" x2="990" y2="286" class="edge"/>

  <!-- ===== 底部对比卡 ===== -->
  <rect x="40" y="590" width="540" height="106" rx="12" class="cmp-card" stroke="#5e35b1"/>
  <text x="60" y="616" class="cmp-title" fill="#4a148c">运行时常量池</text>
  <text x="60" y="642" class="cmp-row">位置：方法区（元空间 / 永久代）</text>
  <text x="60" y="664" class="cmp-row">份数：每个类 / 接口各一份</text>
  <text x="60" y="686" class="cmp-row">内容：字面量 + 符号引用 + 动态常量（描述与引用）</text>

  <rect x="620" y="590" width="540" height="106" rx="12" class="cmp-card" stroke="#f9a825"/>
  <text x="640" y="616" class="cmp-title" fill="#e65100">字符串常量池</text>
  <text x="640" y="642" class="cmp-row">位置：堆（JDK 7 起；之前为永久代）</text>
  <text x="640" y="664" class="cmp-row">份数：全局唯一一张表</text>
  <text x="640" y="686" class="cmp-row">内容：String 对象引用（内容 → 唯一引用映射）</text>
</svg>
