<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840">
  <defs>
    <style>
      .title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:26px; font-weight:bold; fill:#1A1A2E; text-anchor:middle; }
      .sub { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#607D8B; text-anchor:middle; }
      .panel { fill:#FFFFFF; stroke:#E0E4E8; stroke-width:1; }
      .panel-title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:16px; font-weight:bold; fill:#1A1A2E; text-anchor:middle; }
      .bar-label { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11px; fill:#37474F; text-anchor:middle; }
      .band { fill:#F3E5F5; stroke:#5e35b1; stroke-width:1.5; }
      .band-title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11.5px; font-weight:bold; fill:#5e35b1; text-anchor:middle; }
      .seg-name { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:10px; font-weight:bold; fill:#37474F; text-anchor:middle; }
      .tag-stw { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:9.5px; font-weight:bold; fill:#1976d2; text-anchor:middle; }
      .tag-conc { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:9.5px; font-weight:bold; fill:#388e3c; text-anchor:middle; }
      .legend-text { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11.5px; fill:#374151; }
      .loop-box { fill:#FFFFFF; stroke:#1976d2; stroke-width:1.5; }
      .loop-box2 { fill:#FFFFFF; stroke:#5e35b1; stroke-width:1.5; }
      .loop-title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:12.5px; font-weight:bold; fill:#01579b; text-anchor:start; }
      .loop-title2 { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11px; font-weight:bold; fill:#4a148c; text-anchor:start; }
      .loop-sub { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:10px; fill:#37474F; text-anchor:start; }
      .edge-blue { stroke:#1976d2; stroke-width:2; fill:none; marker-end:url(#arr-blue); }
      .edge-purple { stroke:#5e35b1; stroke-width:2; fill:none; marker-end:url(#arr-purple); }
      .edge-teal { stroke:#00695c; stroke-width:1.8; fill:none; stroke-dasharray:6 4; marker-end:url(#arr-teal); }
      .dashed-purple { stroke:#5e35b1; stroke-width:1.5; stroke-dasharray:5 4; fill:none; }
      .axis { stroke:#78909c; stroke-width:1.5; marker-end:url(#arr-gray); }
      .time-label { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11px; fill:#607D8B; text-anchor:middle; }
      .bottom-note { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:12.5px; fill:#607D8B; text-anchor:middle; }
      .note-line { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:10.5px; fill:#5e35b1; text-anchor:start; }
    </style>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1976d2"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5e35b1"/>
    </marker>
    <marker id="arr-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00695c"/>
    </marker>
    <marker id="arr-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546e7a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="840" fill="#F5F7FA"/>

  <text x="600" y="40" class="title">G1（Garbage-First）垃圾回收工作流程</text>
  <text x="600" y="66" class="sub">两个独立循环：Young GC 高频反复；并发标记 + Mixed GC 低频按需——在时间线上穿插进行</text>

  <!-- ===== 时间线：两个循环的穿插 ===== -->
  <rect x="40" y="88" width="1120" height="320" rx="12" class="panel"/>
  <text x="600" y="112" class="panel-title">时间线：Young GC 高频循环，与低频的「标记 + Mixed GC」循环穿插</text>

  <!-- 并发标记周期条带 -->
  <rect x="245" y="126" width="470" height="80" rx="8" class="band"/>
  <text x="480" y="142" class="band-title">并发标记周期：只标记、不回收，穿插在多次 Young GC 之间完成</text>
  <rect x="255" y="152" width="60" height="50" rx="5" fill="#BBDEFB" stroke="#1976d2" stroke-width="1"/>
  <text x="285" y="172" class="seg-name">初始标记</text><text x="285" y="192" class="tag-stw">STW</text>
  <rect x="320" y="152" width="65" height="50" rx="5" fill="#E8F5E9" stroke="#388e3c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="352" y="172" class="seg-name">根区扫描</text><text x="352" y="192" class="tag-conc">并发</text>
  <rect x="390" y="152" width="150" height="50" rx="5" fill="#E8F5E9" stroke="#388e3c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="465" y="172" class="seg-name">并发标记</text><text x="465" y="192" class="tag-conc">并发</text>
  <rect x="545" y="152" width="70" height="50" rx="5" fill="#BBDEFB" stroke="#1976d2" stroke-width="1"/>
  <text x="580" y="172" class="seg-name">重新标记</text><text x="580" y="192" class="tag-stw">STW</text>
  <rect x="620" y="152" width="85" height="50" rx="5" fill="#BBDEFB" stroke="#1976d2" stroke-width="1"/>
  <text x="662" y="172" class="seg-name">清理</text><text x="662" y="192" class="tag-stw">STW</text>

  <!-- 虚线：初始标记与一次 Young GC 共用停顿 -->
  <line x1="285" y1="202" x2="285" y2="234" class="dashed-purple"/>
  <text x="294" y="224" class="note-line" fill="#5e35b1">虚线 = 初始标记搭在一次 Young GC 的停顿上（STW）</text>

  <!-- 时间轴与回收事件 -->
  <line x1="100" y1="236" x2="1100" y2="236" class="axis"/>
  <text x="1125" y="231" class="time-label">时间 →</text>

  <rect x="107" y="238" width="26" height="48" fill="#1976d2"/><text x="120" y="300" class="bar-label">Young GC</text>
  <rect x="187" y="238" width="26" height="48" fill="#1976d2"/><text x="200" y="300" class="bar-label">Young GC</text>
  <rect x="267" y="238" width="26" height="48" fill="#1976d2"/><text x="280" y="300" class="bar-label">Young GC</text>
  <rect x="347" y="238" width="26" height="48" fill="#1976d2"/><text x="360" y="300" class="bar-label">Young GC</text>
  <rect x="427" y="238" width="26" height="48" fill="#1976d2"/><text x="440" y="300" class="bar-label">Young GC</text>
  <rect x="507" y="238" width="26" height="48" fill="#1976d2"/><text x="520" y="300" class="bar-label">Young GC</text>
  <rect x="587" y="238" width="26" height="48" fill="#1976d2"/><text x="600" y="300" class="bar-label">Young GC</text>
  <rect x="667" y="238" width="26" height="48" fill="#1976d2"/><text x="680" y="300" class="bar-label">Young GC</text>
  <rect x="747" y="238" width="26" height="48" fill="#1976d2"/><text x="760" y="300" class="bar-label">Young GC</text>
  <rect x="827" y="238" width="26" height="48" fill="#00695c"/><text x="840" y="300" class="bar-label">Mixed GC</text>
  <rect x="902" y="238" width="26" height="48" fill="#00695c"/><text x="915" y="300" class="bar-label">Mixed GC</text>
  <rect x="977" y="238" width="26" height="48" fill="#00695c"/><text x="990" y="300" class="bar-label">Mixed GC</text>
  <rect x="1057" y="238" width="26" height="48" fill="#1976d2"/><text x="1070" y="300" class="bar-label">Young GC</text>

  <!-- 标记完成 → 连续多次 Mixed GC -->
  <path d="M 715 190 C 755 190 755 236 822 236" class="edge-teal"/>
  <text x="836" y="228" class="note-line" fill="#00695c">箭头 = 标记完成，接下来连续多次 Mixed GC</text>

  <!-- 图例 -->
  <rect x="110" y="326" width="16" height="16" rx="3" fill="#1976d2"/>
  <text x="134" y="338" class="legend-text">Young GC（STW，高频）</text>
  <rect x="470" y="326" width="16" height="16" rx="3" fill="#00695c"/>
  <text x="494" y="338" class="legend-text">Mixed GC（STW，回收老年代）</text>
  <rect x="840" y="326" width="16" height="16" rx="3" fill="#F3E5F5" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="864" y="338" class="legend-text">并发标记周期（只标记不回收）</text>

  <rect x="110" y="354" width="16" height="16" rx="3" fill="#BBDEFB" stroke="#1976d2" stroke-width="1"/>
  <text x="134" y="366" class="legend-text">STW 子阶段</text>
  <rect x="280" y="354" width="16" height="16" rx="3" fill="#E8F5E9" stroke="#388e3c" stroke-width="1"/>
  <text x="304" y="366" class="legend-text">并发子阶段</text>
  <line x1="450" y1="362" x2="478" y2="362" class="dashed-purple"/>
  <text x="486" y="366" class="legend-text">初始标记与一次 Young GC 共用停顿</text>

  <!-- ===== 循环一：Young GC ===== -->
  <rect x="40" y="428" width="560" height="260" rx="12" class="panel"/>
  <text x="320" y="452" class="panel-title">循环一：Young GC（高频，反复进行）</text>

  <rect x="56" y="462" width="232" height="72" rx="8" class="loop-box"/>
  <text x="72" y="484" class="loop-title">① 新对象分配在 Eden Region</text>
  <text x="72" y="504" class="loop-sub">Eden 逐渐被占满</text>

  <rect x="328" y="462" width="232" height="72" rx="8" class="loop-box"/>
  <text x="344" y="484" class="loop-title">② Eden 占满，触发 Young GC</text>
  <text x="344" y="504" class="loop-sub">应用线程 STW</text>

  <rect x="328" y="548" width="232" height="72" rx="8" class="loop-box"/>
  <text x="344" y="570" class="loop-title">③ STW 并行复制存活对象</text>
  <text x="344" y="590" class="loop-sub">→ Survivor，年龄达标晋升 Old</text>
  <text x="344" y="608" class="loop-sub">借助 RSet 定位跨 Region 引用</text>

  <rect x="56" y="548" width="232" height="72" rx="8" class="loop-box"/>
  <text x="72" y="570" class="loop-title">④ 回收后的 Region 变 Free</text>
  <text x="72" y="590" class="loop-sub">重新投入对象分配，回到①</text>

  <line x1="290" y1="498" x2="322" y2="498" class="edge-blue"/>
  <line x1="444" y1="536" x2="444" y2="546" class="edge-blue"/>
  <line x1="326" y1="584" x2="292" y2="584" class="edge-blue"/>
  <line x1="172" y1="546" x2="172" y2="536" class="edge-blue"/>

  <!-- ===== 循环二：并发标记 + Mixed GC ===== -->
  <rect x="620" y="428" width="540" height="260" rx="12" class="panel"/>
  <text x="890" y="452" class="panel-title">循环二：并发标记 + Mixed GC（低频，按需）</text>

  <rect x="640" y="466" width="500" height="42" rx="8" class="loop-box2"/>
  <text x="656" y="484" class="loop-title2">① 堆占用率达到阈值（默认 45%）</text>
  <text x="656" y="502" class="loop-sub">说明老年代积累，启动并发标记周期</text>

  <rect x="640" y="524" width="500" height="42" rx="8" class="loop-box2"/>
  <text x="656" y="542" class="loop-title2">② 并发标记周期（只标记不回收，穿插在多次 Young GC 之间）</text>
  <text x="656" y="560" class="loop-sub">初始标记(STW) → 根区扫描 → 并发标记 → 重新标记(STW) → 清理</text>

  <rect x="640" y="582" width="500" height="42" rx="8" class="loop-box2"/>
  <text x="656" y="600" class="loop-title2">③ 连续多次 Mixed GC：垃圾占比最高的 Region 组成 CSet</text>
  <text x="656" y="618" class="loop-sub">连同年轻代一起 STW 复制回收，回收量受停顿预测模型控制</text>

  <rect x="640" y="640" width="500" height="42" rx="8" class="loop-box2"/>
  <text x="656" y="658" class="loop-title2">④ 堆占用率回落 → 停止 Mixed GC</text>
  <text x="656" y="676" class="loop-sub">回到只做 Young GC 的常态</text>

  <line x1="890" y1="510" x2="890" y2="522" class="edge-purple"/>
  <line x1="890" y1="568" x2="890" y2="580" class="edge-purple"/>
  <line x1="890" y1="626" x2="890" y2="638" class="edge-purple"/>

  <!-- 底部说明 -->
  <text x="600" y="716" class="bottom-note">要点：Young GC 是常态循环；并发标记周期只负责「找出老年代里哪些 Region 垃圾多」；</text>
  <text x="600" y="742" class="bottom-note">Mixed GC 才真正回收老年代——回收量由停顿预测模型按停顿目标（默认 200ms）动态决定，G1 复制回收、无碎片</text>
</svg>
