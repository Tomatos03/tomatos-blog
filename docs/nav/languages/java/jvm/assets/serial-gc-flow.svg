<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:26px; font-weight:bold; fill:#1A1A2E; text-anchor:middle; }
      .sub { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; fill:#607D8B; text-anchor:middle; }
      .panel { fill:#FFFFFF; stroke:#E0E4E8; stroke-width:1; }
      .panel-title { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:16px; font-weight:bold; fill:#1A1A2E; text-anchor:middle; }
      .region-label { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:13px; font-weight:bold; fill:#01579b; text-anchor:start; }
      .eden { fill:#E3F2FD; stroke:#1976d2; stroke-width:2; }
      .surv { fill:#FFF8E1; stroke:#f9a825; stroke-width:2; }
      .old { fill:#EDE7F6; stroke:#5e35b1; stroke-width:2; }
      .alive { fill:#E8F5E9; stroke:#388e3c; stroke-width:1.5; }
      .dead { fill:#FFEBEE; stroke:#d32f2f; stroke-width:1.5; }
      .promoted { fill:#FFF3E0; stroke:#ef6c00; stroke-width:1.5; }
      .obj { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:12px; font-weight:bold; fill:#37474F; text-anchor:middle; dominant-baseline:middle; }
      .empty { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:14px; fill:#9E9E9E; text-anchor:middle; dominant-baseline:middle; }
      .phase { fill:#FFFFFF; stroke:#1976d2; stroke-width:2; }
      .phase-text { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:12.5px; fill:#37474F; text-anchor:middle; }
      .phase-num { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:14px; font-weight:bold; fill:#FFFFFF; text-anchor:middle; dominant-baseline:middle; }
      .edge { stroke:#546e7a; stroke-width:1.8; fill:none; marker-end:url(#arrowhead); }
      .dash { stroke:#9e9e9e; stroke-width:1.6; fill:none; stroke-dasharray:6,4; marker-end:url(#arrowhead-gray); }
      .dash-label { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11.5px; font-weight:bold; fill:#78909c; text-anchor:middle; }
      .mini { fill:#EDE7F6; stroke:#5e35b1; stroke-width:1.5; }
      .mini-text { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:12.5px; font-weight:bold; fill:#4a148c; text-anchor:middle; dominant-baseline:middle; }
      .note { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:11.5px; fill:#5d4037; text-anchor:start; }
      .legend-text { font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size:12px; fill:#374151; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546e7a"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9e9e9e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#F5F7FA"/>

  <text x="600" y="40" class="title">Serial 串行回收器工作流程</text>
  <text x="600" y="66" class="sub">新生代 Minor GC + 老年代 Serial Old：单线程串行回收，全程 STW</text>

  <!-- ===== 回收前面板 ===== -->
  <rect x="40" y="90" width="526" height="410" rx="12" class="panel"/>
  <text x="303" y="116" class="panel-title">回收前：Eden 区已满，触发 Minor GC</text>

  <rect x="60" y="135" width="290" height="175" rx="6" class="eden"/>
  <text x="70" y="157" class="region-label">Eden 区</text>
  <!-- Eden1 对象：绿=存活 红=垃圾 -->
  <rect x="72" y="172" width="38" height="30" rx="4" class="alive"/><text x="91" y="187" class="obj">A</text>
  <rect x="120" y="172" width="38" height="30" rx="4" class="dead"/><text x="139" y="187" class="obj">B</text>
  <rect x="168" y="172" width="38" height="30" rx="4" class="alive"/><text x="187" y="187" class="obj">C</text>
  <rect x="216" y="172" width="38" height="30" rx="4" class="dead"/><text x="235" y="187" class="obj">D</text>
  <rect x="264" y="172" width="38" height="30" rx="4" class="alive"/><text x="283" y="187" class="obj">E</text>
  <rect x="72" y="222" width="38" height="30" rx="4" class="dead"/><text x="91" y="237" class="obj">F</text>
  <rect x="120" y="222" width="38" height="30" rx="4" class="alive"/><text x="139" y="237" class="obj">G</text>
  <rect x="168" y="222" width="38" height="30" rx="4" class="dead"/><text x="187" y="237" class="obj">H</text>
  <rect x="216" y="222" width="38" height="30" rx="4" class="alive"/><text x="235" y="237" class="obj">I</text>
  <rect x="264" y="222" width="38" height="30" rx="4" class="dead"/><text x="283" y="237" class="obj">J</text>
  <rect x="72" y="272" width="38" height="30" rx="4" class="alive"/><text x="91" y="287" class="obj">K</text>
  <rect x="120" y="272" width="38" height="30" rx="4" class="dead"/><text x="139" y="287" class="obj">L</text>
  <rect x="168" y="272" width="38" height="30" rx="4" class="dead"/><text x="187" y="287" class="obj">M</text>
  <rect x="216" y="272" width="38" height="30" rx="4" class="alive"/><text x="235" y="287" class="obj">N</text>
  <rect x="264" y="272" width="38" height="30" rx="4" class="dead"/><text x="283" y="287" class="obj">O</text>

  <rect x="370" y="135" width="90" height="175" rx="6" class="surv"/>
  <text x="415" y="157" class="region-label">S0</text>
  <text x="415" y="225" class="empty">空</text>

  <rect x="470" y="135" width="90" height="175" rx="6" class="surv"/>
  <text x="515" y="157" class="region-label">S1</text>
  <rect x="480" y="172" width="38" height="30" rx="4" class="alive"/><text x="499" y="187" class="obj">P</text>
  <rect x="520" y="172" width="38" height="30" rx="4" class="alive"/><text x="539" y="187" class="obj">Q</text>
  <rect x="480" y="222" width="38" height="30" rx="4" class="alive"/><text x="499" y="237" class="obj">R</text>

  <rect x="60" y="330" width="500" height="150" rx="6" class="old"/>
  <text x="70" y="352" class="region-label">老年代 Old</text>
  <rect x="72" y="365" width="38" height="30" rx="4" class="alive"/><text x="91" y="380" class="obj">a</text>
  <rect x="122" y="365" width="38" height="30" rx="4" class="alive"/><text x="141" y="380" class="obj">b</text>
  <rect x="172" y="365" width="38" height="30" rx="4" class="dead"/><text x="191" y="380" class="obj">c</text>
  <rect x="222" y="365" width="38" height="30" rx="4" class="alive"/><text x="241" y="380" class="obj">d</text>
  <rect x="272" y="365" width="38" height="30" rx="4" class="alive"/><text x="291" y="380" class="obj">e</text>
  <rect x="322" y="365" width="38" height="30" rx="4" class="alive"/><text x="341" y="380" class="obj">f</text>
  <rect x="372" y="365" width="38" height="30" rx="4" class="alive"/><text x="391" y="380" class="obj">g</text>
  <rect x="422" y="365" width="38" height="30" rx="4" class="alive"/><text x="441" y="380" class="obj">h</text>
  <rect x="72" y="415" width="38" height="30" rx="4" class="alive"/><text x="91" y="430" class="obj">i</text>
  <rect x="122" y="415" width="38" height="30" rx="4" class="alive"/><text x="141" y="430" class="obj">j</text>
  <rect x="172" y="415" width="38" height="30" rx="4" class="alive"/><text x="191" y="430" class="obj">k</text>
  <rect x="222" y="415" width="38" height="30" rx="4" class="dead"/><text x="241" y="430" class="obj">l</text>
  <rect x="272" y="415" width="38" height="30" rx="4" class="alive"/><text x="291" y="430" class="obj">m</text>
  <rect x="322" y="415" width="38" height="30" rx="4" class="alive"/><text x="341" y="430" class="obj">n</text>
  <rect x="372" y="415" width="38" height="30" rx="4" class="alive"/><text x="391" y="430" class="obj">o</text>
  <rect x="422" y="415" width="38" height="30" rx="4" class="alive"/><text x="441" y="430" class="obj">p</text>

  <!-- ===== 回收后面板 ===== -->
  <rect x="634" y="90" width="526" height="410" rx="12" class="panel"/>
  <text x="897" y="116" class="panel-title">回收后：Eden 清空，存活对象已转移</text>

  <rect x="654" y="135" width="290" height="175" rx="6" class="eden"/>
  <text x="664" y="157" class="region-label" font-size="12.5px">Eden 区（已清空）</text>
  <text x="799" y="235" class="empty">空</text>

  <rect x="974" y="135" width="90" height="175" rx="6" class="surv"/>
  <text x="1019" y="157" class="region-label">S0</text>
  <rect x="984" y="172" width="38" height="30" rx="4" class="alive"/><text x="1003" y="187" class="obj">A</text>
  <rect x="1024" y="172" width="38" height="30" rx="4" class="alive"/><text x="1043" y="187" class="obj">C</text>
  <rect x="984" y="222" width="38" height="30" rx="4" class="alive"/><text x="1003" y="237" class="obj">E</text>
  <rect x="1024" y="222" width="38" height="30" rx="4" class="alive"/><text x="1043" y="237" class="obj">G</text>
  <rect x="984" y="272" width="38" height="30" rx="4" class="alive"/><text x="1003" y="287" class="obj">I</text>
  <rect x="1024" y="272" width="38" height="30" rx="4" class="alive"/><text x="1043" y="287" class="obj">N</text>
  <text x="1043" y="298" class="obj" font-size="11px">…</text>

  <rect x="1064" y="135" width="90" height="175" rx="6" class="surv"/>
  <text x="1109" y="157" class="region-label">S1</text>
  <text x="1109" y="225" class="empty">空</text>

  <rect x="654" y="330" width="500" height="150" rx="6" class="old"/>
  <text x="664" y="352" class="region-label">老年代 Old（新增晋升对象）</text>
  <rect x="664" y="365" width="38" height="30" rx="4" class="alive"/><text x="683" y="380" class="obj">a</text>
  <rect x="712" y="365" width="38" height="30" rx="4" class="alive"/><text x="731" y="380" class="obj">b</text>
  <rect x="760" y="365" width="38" height="30" rx="4" class="alive"/><text x="779" y="380" class="obj">c</text>
  <rect x="808" y="365" width="38" height="30" rx="4" class="alive"/><text x="827" y="380" class="obj">d</text>
  <rect x="856" y="365" width="38" height="30" rx="4" class="alive"/><text x="875" y="380" class="obj">e</text>
  <rect x="904" y="365" width="38" height="30" rx="4" class="alive"/><text x="923" y="380" class="obj">f</text>
  <rect x="952" y="365" width="38" height="30" rx="4" class="alive"/><text x="971" y="380" class="obj">g</text>
  <rect x="1000" y="365" width="38" height="30" rx="4" class="alive"/><text x="1019" y="380" class="obj">h</text>
  <rect x="1048" y="365" width="38" height="30" rx="4" class="promoted"/><text x="1067" y="380" class="obj">E</text>
  <rect x="664" y="415" width="38" height="30" rx="4" class="alive"/><text x="683" y="430" class="obj">i</text>
  <rect x="712" y="415" width="38" height="30" rx="4" class="alive"/><text x="731" y="430" class="obj">j</text>
  <rect x="760" y="415" width="38" height="30" rx="4" class="alive"/><text x="779" y="430" class="obj">k</text>
  <rect x="808" y="415" width="38" height="30" rx="4" class="alive"/><text x="827" y="430" class="obj">l</text>
  <rect x="856" y="415" width="38" height="30" rx="4" class="alive"/><text x="875" y="430" class="obj">m</text>
  <rect x="904" y="415" width="38" height="30" rx="4" class="alive"/><text x="923" y="430" class="obj">n</text>
  <rect x="952" y="415" width="38" height="30" rx="4" class="alive"/><text x="971" y="430" class="obj">o</text>
  <rect x="1000" y="415" width="38" height="30" rx="4" class="alive"/><text x="1019" y="430" class="obj">p</text>
  <rect x="1048" y="415" width="38" height="30" rx="4" class="promoted"/><text x="1067" y="430" class="obj">J</text>

  <!-- ===== 中间：GC 线程 + STW ===== -->
  <circle cx="600" cy="200" r="28" fill="#E8F5E9" stroke="#388e3c" stroke-width="2"/>
  <text x="600" y="206" class="obj" font-size="16px" fill="#2e7d32">GC</text>
  <text x="600" y="248" class="obj" font-size="12px" fill="#455a64">单线程</text>

  <rect x="566" y="286" width="68" height="116" rx="12" fill="#FFEBEE" stroke="#d32f2f" stroke-width="1.5"/>
  <text x="600" y="312" class="obj" font-size="16px" fill="#b71c1c">STW</text>
  <text x="600" y="336" class="obj" font-size="10px" fill="#b71c1c">所有应用</text>
  <text x="600" y="354" class="obj" font-size="10px" fill="#b71c1c">线程暂停</text>
  <text x="600" y="372" class="obj" font-size="10px" fill="#b71c1c">回收期间</text>
  <text x="600" y="390" class="obj" font-size="10px" fill="#b71c1c">全程</text>

  <!-- ===== 图例 ===== -->
  <rect x="44" y="518" width="16" height="16" rx="3" class="alive"/>
  <text x="68" y="530" class="legend-text">存活对象</text>
  <rect x="190" y="518" width="16" height="16" rx="3" class="dead"/>
  <text x="214" y="530" class="legend-text">垃圾对象（将被回收）</text>
  <rect x="396" y="518" width="16" height="16" rx="3" class="promoted"/>
  <text x="420" y="530" class="legend-text">晋升对象</text>

  <!-- ===== 虚线连接：触发条件 / 回收结果 ===== -->
  <path d="M 305 502 L 165 553" class="dash"/>
  <text x="236" y="520" class="dash-label">触发条件</text>
  <path d="M 1124 595 L 1124 545 L 897 545 L 897 502" class="dash"/>
  <text x="1120" y="538" class="dash-label" text-anchor="end">回收结果</text>

  <!-- ===== 四阶段流程 ===== -->
  <rect x="40" y="555" width="250" height="80" rx="10" class="phase"/>
  <circle cx="68" cy="575" r="14" fill="#1976d2"/>
  <text x="68" y="575" class="phase-num">①</text>
  <text x="165" y="598" class="phase-text">Eden 空间不足</text>
  <text x="165" y="620" class="phase-text">触发 Minor GC（STW 开始）</text>

  <rect x="318" y="555" width="250" height="80" rx="10" class="phase"/>
  <circle cx="346" cy="575" r="14" fill="#1976d2"/>
  <text x="346" y="575" class="phase-num">②</text>
  <text x="443" y="598" class="phase-text">单线程复制存活对象</text>
  <text x="443" y="620" class="phase-text">至空闲 Survivor（S0⇄S1 交替）</text>

  <rect x="596" y="555" width="250" height="80" rx="10" class="phase"/>
  <circle cx="624" cy="575" r="14" fill="#1976d2"/>
  <text x="624" y="575" class="phase-num">③</text>
  <text x="721" y="598" class="phase-text">对象年龄 +1</text>
  <text x="721" y="620" class="phase-text">达阈值（默认 15）晋升老年代</text>

  <rect x="874" y="555" width="250" height="80" rx="10" class="phase"/>
  <circle cx="902" cy="575" r="14" fill="#1976d2"/>
  <text x="902" y="575" class="phase-num">④</text>
  <text x="999" y="598" class="phase-text">清空 Eden 与源 Survivor</text>
  <text x="999" y="620" class="phase-text">空间释放，STW 结束</text>

  <line x1="290" y1="595" x2="316" y2="595" class="edge"/>
  <line x1="568" y1="595" x2="594" y2="595" class="edge"/>
  <line x1="846" y1="595" x2="872" y2="595" class="edge"/>

  <!-- ===== 老年代 Serial Old ===== -->
  <text x="40" y="704" class="panel-title" font-size="15px" text-anchor="start">老年代回收（Serial Old）：标记-整理 Mark-Compact</text>

  <rect x="40" y="716" width="230" height="50" rx="10" class="mini"/>
  <text x="155" y="741" class="mini-text">① 标记存活对象</text>
  <rect x="300" y="716" width="230" height="50" rx="10" class="mini"/>
  <text x="415" y="741" class="mini-text">② 存活对象向一端移动</text>
  <rect x="560" y="716" width="230" height="50" rx="10" class="mini"/>
  <text x="675" y="741" class="mini-text">③ 回收边界外空间（无碎片）</text>
  <line x1="272" y1="741" x2="298" y2="741" class="edge"/>
  <line x1="532" y1="741" x2="558" y2="741" class="edge"/>

  <rect x="820" y="716" width="340" height="50" rx="10" fill="#FFFDE7" stroke="#f9a825" stroke-width="1.5"/>
  <text x="836" y="736" class="note">触发：老年代空间不足 / 晋升失败 / 元空间不足</text>
  <text x="836" y="756" class="note">移动对象需更新引用，全程 STW 停顿较长</text>
</svg>
