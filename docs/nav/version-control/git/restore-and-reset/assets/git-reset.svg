<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="960" height="510" fill="#f1f5f9"/>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">git reset 三种模式对比</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">执行 git reset &lt;hash&gt; 之后：HEAD 从 C 回退到 A，灰色表示已移出历史或被清除</text>

  <!-- 列 1: soft -->
  <g>
    <rect x="30" y="88" width="270" height="312" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="30" y="88" width="270" height="5" rx="2.5" fill="#0f766e"/>
    <text x="165" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f766e">--soft</text>
    <text x="165" y="142" text-anchor="middle" font-size="12" fill="#64748b">git reset --soft &lt;hash&gt;</text>
    <line x1="45" y1="154" x2="285" y2="154" stroke="#e5e7eb" stroke-width="1"/>

    <text x="46" y="172" font-size="12" fill="#6b7280">提交历史 (HEAD)</text>
    <rect x="44" y="182" width="30" height="17" rx="3" fill="#2563eb"/>
    <text x="59" y="195" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">HEAD</text>
    <line x1="59" y1="199" x2="59" y2="204" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    
    <rect x="30" y="205" width="58" height="26" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="59" y="223" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">A</text>
    <rect x="100" y="205" width="58" height="26" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="129" y="223" text-anchor="middle" font-size="14" fill="#9ca3af">B</text>
    <rect x="170" y="205" width="58" height="26" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="199" y="223" text-anchor="middle" font-size="14" fill="#9ca3af">C</text>
    <line x1="88" y1="218" x2="98" y2="218" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    <line x1="158" y1="218" x2="168" y2="218" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    
    <text x="46" y="256" font-size="12" fill="#6b7280">暂存区 (Index)</text>
    <rect x="46" y="264" width="238" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="165" y="289" text-anchor="middle" font-size="13" fill="#15803d">B、C 改动仍已暂存 ✓</text>
    
    <text x="46" y="330" font-size="12" fill="#6b7280">工作区 (Working Tree)</text>
    <rect x="46" y="338" width="238" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="165" y="363" text-anchor="middle" font-size="13" fill="#15803d">文件改动保留 ✓</text>
  </g>

  <!-- 列 2: mixed -->
  <g>
    <rect x="345" y="88" width="270" height="312" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="345" y="88" width="270" height="5" rx="2.5" fill="#b45309"/>
    <text x="480" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#b45309">--mixed</text>
    <text x="480" y="142" text-anchor="middle" font-size="12" fill="#64748b">git reset &lt;hash&gt;（默认）</text>
    <line x1="360" y1="154" x2="600" y2="154" stroke="#e5e7eb" stroke-width="1"/>

    <text x="361" y="172" font-size="12" fill="#6b7280">提交历史 (HEAD)</text>
    <rect x="359" y="182" width="30" height="17" rx="3" fill="#2563eb"/>
    <text x="374" y="195" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">HEAD</text>
    <line x1="374" y1="199" x2="374" y2="204" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    
    <rect x="345" y="205" width="58" height="26" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="374" y="223" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">A</text>
    <rect x="415" y="205" width="58" height="26" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="444" y="223" text-anchor="middle" font-size="14" fill="#9ca3af">B</text>
    <rect x="485" y="205" width="58" height="26" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="514" y="223" text-anchor="middle" font-size="14" fill="#9ca3af">C</text>
    <line x1="403" y1="218" x2="413" y2="218" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    <line x1="473" y1="218" x2="483" y2="218" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    
    <text x="361" y="256" font-size="12" fill="#6b7280">暂存区 (Index)</text>
    <rect x="361" y="264" width="238" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="480" y="289" text-anchor="middle" font-size="13" fill="#b91c1c">已清除（空）✗</text>
    
    <text x="361" y="330" font-size="12" fill="#6b7280">工作区 (Working Tree)</text>
    <rect x="361" y="338" width="238" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="480" y="363" text-anchor="middle" font-size="13" fill="#15803d">文件改动保留 ✓</text>
  </g>

  <!-- 列 3: hard -->
  <g>
    <rect x="660" y="88" width="270" height="312" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="660" y="88" width="270" height="5" rx="2.5" fill="#b91c1c"/>
    <text x="795" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#b91c1c">--hard</text>
    <text x="795" y="142" text-anchor="middle" font-size="12" fill="#64748b">git reset --hard &lt;hash&gt;</text>
    <line x1="675" y1="154" x2="915" y2="154" stroke="#e5e7eb" stroke-width="1"/>

    <text x="676" y="172" font-size="12" fill="#6b7280">提交历史 (HEAD)</text>
    <rect x="674" y="182" width="30" height="17" rx="3" fill="#2563eb"/>
    <text x="689" y="195" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">HEAD</text>
    <line x1="689" y1="199" x2="689" y2="204" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    
    <rect x="660" y="205" width="58" height="26" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="689" y="223" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">A</text>
    <rect x="730" y="205" width="58" height="26" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="759" y="223" text-anchor="middle" font-size="14" fill="#9ca3af">B</text>
    <rect x="800" y="205" width="58" height="26" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="829" y="223" text-anchor="middle" font-size="14" fill="#9ca3af">C</text>
    <line x1="718" y1="218" x2="728" y2="218" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    <line x1="788" y1="218" x2="798" y2="218" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    
    <text x="676" y="256" font-size="12" fill="#6b7280">暂存区 (Index)</text>
    <rect x="676" y="264" width="238" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="795" y="289" text-anchor="middle" font-size="13" fill="#b91c1c">已清除（空）✗</text>
    
    <text x="676" y="330" font-size="12" fill="#6b7280">工作区 (Working Tree)</text>
    <rect x="676" y="338" width="238" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="795" y="363" text-anchor="middle" font-size="13" fill="#b91c1c">已清除（还原为 A 内容）✗</text>
  </g>

  <!-- 图例 -->
  <rect x="210" y="428" width="18" height="18" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="234" y="442" font-size="13" fill="#374151">保留：内容不变</text>
  <rect x="400" y="428" width="18" height="18" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="424" y="442" font-size="13" fill="#374151">清除：内容被丢弃</text>
  <rect x="590" y="428" width="18" height="18" rx="3" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="614" y="442" font-size="13" fill="#374151">移出历史：可用 git reflog 找回</text>

  <text x="480" y="482" text-anchor="middle" font-size="12.5" fill="#64748b">提示：--soft 与 --mixed 都不改动工作区文件内容，唯一差别是暂存区是否保留改动</text>
</svg>
