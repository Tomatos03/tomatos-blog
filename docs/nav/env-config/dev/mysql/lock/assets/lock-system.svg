<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="820" height="540" fill="#ffffff"/>
  <rect x="310" y="20" width="200" height="44" rx="8" fill="#e6edf5" stroke="#5b7aa8" stroke-width="2"/>
  <text x="410" y="47" text-anchor="middle" font-size="16" font-weight="bold" fill="#22303f">MySQL 锁</text>

  <path d="M410 64 L250 110" stroke="#5b7aa8" stroke-width="2"/>
  <path d="M410 64 L570 110" stroke="#5b7aa8" stroke-width="2"/>

  <rect x="100" y="110" width="300" height="40" rx="8" fill="#dbe8f6" stroke="#5b7aa8" stroke-width="2"/>
  <text x="250" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#22303f">表级锁（Server / 显式）</text>

  <rect x="420" y="110" width="300" height="40" rx="8" fill="#f6e3d5" stroke="#c07a3a" stroke-width="2"/>
  <text x="570" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#22303f">行级锁（InnoDB）</text>

  <path d="M250 150 L250 180" stroke="#8aa2bf" stroke-width="2"/>
  <path d="M250 216 L250 230" stroke="#8aa2bf" stroke-width="2"/>
  <path d="M250 266 L250 280" stroke="#8aa2bf" stroke-width="2"/>

  <rect x="100" y="180" width="300" height="36" rx="6" fill="#ffffff" stroke="#8aa2bf" stroke-width="1.5"/>
  <text x="250" y="203" text-anchor="middle" fill="#22303f">MDL 元数据锁</text>
  <rect x="100" y="230" width="300" height="36" rx="6" fill="#ffffff" stroke="#8aa2bf" stroke-width="1.5"/>
  <text x="250" y="253" text-anchor="middle" fill="#22303f">意向锁 IS / IX</text>
  <rect x="100" y="280" width="300" height="36" rx="6" fill="#ffffff" stroke="#8aa2bf" stroke-width="1.5"/>
  <text x="250" y="303" text-anchor="middle" fill="#22303f">显式表锁 S / X</text>

  <path d="M570 150 L570 180" stroke="#c99a6d" stroke-width="2"/>
  <path d="M570 216 L570 230" stroke="#c99a6d" stroke-width="2"/>
  <path d="M570 266 L570 280" stroke="#c99a6d" stroke-width="2"/>
  <path d="M570 316 L570 330" stroke="#c99a6d" stroke-width="2"/>

  <rect x="420" y="180" width="300" height="36" rx="6" fill="#ffffff" stroke="#c99a6d" stroke-width="1.5"/>
  <text x="570" y="203" text-anchor="middle" fill="#22303f">记录锁 Record Lock</text>
  <rect x="420" y="230" width="300" height="36" rx="6" fill="#ffffff" stroke="#c99a6d" stroke-width="1.5"/>
  <text x="570" y="253" text-anchor="middle" fill="#22303f">间隙锁 Gap Lock</text>
  <rect x="420" y="280" width="300" height="36" rx="6" fill="#ffffff" stroke="#c99a6d" stroke-width="1.5"/>
  <text x="570" y="303" text-anchor="middle" fill="#22303f">临键锁（记录锁 + 间隙锁）</text>
  <rect x="420" y="330" width="300" height="36" rx="6" fill="#ffffff" stroke="#c99a6d" stroke-width="1.5"/>
  <text x="570" y="353" text-anchor="middle" fill="#22303f">插入意向锁 Insert Intention</text>

  <rect x="160" y="420" width="500" height="52" rx="8" fill="#f3f6fa" stroke="#b7c5d6" stroke-width="1.5"/>
  <text x="410" y="441" text-anchor="middle" fill="#44546a">关键认知</text>
  <text x="410" y="460" text-anchor="middle" fill="#44546a">行锁加在索引记录上，而不是数据行上</text>
</svg>
