<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <style>
      .title { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size: 26px; font-weight: bold; fill: #1A1A2E; text-anchor: middle; }
      .subtitle { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size: 14px; fill: #6b7280; text-anchor: middle; }
      .card-title { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size: 16px; font-weight: bold; }
      .card-sub { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size: 12px; }
      .mono { font-family: 'Courier New', Consolas, monospace; font-size: 13px; }
      .legend-text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size: 13px; fill: #374151; }
      .edge-label { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif; font-size: 12px; font-weight: bold; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8a94a6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00b894"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f57c00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#F5F7FA"/>

  <!-- 标题 -->
  <text x="500" y="48" class="title">MVCC 核心思想：读写互不阻塞</text>
  <text x="500" y="78" class="subtitle">读操作读取历史版本（快照），写操作生成新版本，读与写各自基于版本进行，互不阻塞</text>

  <!-- 事务列 -->
  <!-- T1 -->
  <rect x="60" y="140" width="200" height="80" rx="10" fill="#FFFFFF" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="172" class="card-title" fill="#1976d2" text-anchor="middle">事务 T1</text>
  <text x="160" y="196" class="card-sub" fill="#455a64" text-anchor="middle">快照读 → 读取 v2</text>

  <!-- T2 -->
  <rect x="60" y="260" width="200" height="80" rx="10" fill="#FFFFFF" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="292" class="card-title" fill="#1976d2" text-anchor="middle">事务 T2</text>
  <text x="160" y="316" class="card-sub" fill="#455a64" text-anchor="middle">快照读 → 读取 v3</text>

  <!-- T3 -->
  <rect x="60" y="380" width="200" height="80" rx="10" fill="#FFF8E1" stroke="#f57c00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="412" class="card-title" fill="#e65100" text-anchor="middle">事务 T3</text>
  <text x="160" y="436" class="card-sub" fill="#455a64" text-anchor="middle">写操作 → 生成新版本 v4</text>

  <!-- 版本链 -->
  <!-- v4 最新 -->
  <rect x="440" y="130" width="300" height="70" rx="10" fill="#E8F5E9" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="158" class="card-title" fill="#1b5e20" text-anchor="middle">最新版本 v4（数据行）</text>
  <text x="590" y="182" class="mono" fill="#2e7d32" text-anchor="middle">DB_TRX_ID = 60（T3 写入）</text>

  <!-- v3 -->
  <rect x="440" y="240" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#90a4ae" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="264" class="card-title" fill="#374151" text-anchor="middle">版本 v3（Undo Log）</text>
  <text x="590" y="286" class="mono" fill="#607d8b" text-anchor="middle">DB_TRX_ID = 50</text>

  <!-- v2 -->
  <rect x="440" y="340" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#90a4ae" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="364" class="card-title" fill="#374151" text-anchor="middle">版本 v2（Undo Log）</text>
  <text x="590" y="386" class="mono" fill="#607d8b" text-anchor="middle">DB_TRX_ID = 40</text>

  <!-- v1 -->
  <rect x="440" y="440" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#90a4ae" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="464" class="card-title" fill="#374151" text-anchor="middle">版本 v1（Undo Log，最旧）</text>
  <text x="590" y="486" class="mono" fill="#607d8b" text-anchor="middle">DB_TRX_ID = 30</text>

  <!-- 版本链箭头 -->
  <line x1="590" y1="200" x2="590" y2="238" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="590" y1="300" x2="590" y2="338" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="590" y1="400" x2="590" y2="438" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="602" y="225" class="edge-label" fill="#8a94a6">DB_ROLL_PTR</text>
  <text x="602" y="325" class="edge-label" fill="#8a94a6">DB_ROLL_PTR</text>
  <text x="602" y="425" class="edge-label" fill="#8a94a6">DB_ROLL_PTR</text>

  <!-- 读箭头 -->
  <!-- T1 -> v2 -->
  <polyline points="260,180 330,180 330,370 438,370" fill="none" stroke="#00b894" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGreen)"/>
  <text x="300" y="172" class="edge-label" fill="#00b894">快照读</text>
  <!-- T2 -> v3 -->
  <polyline points="260,300 350,300 350,270 438,270" fill="none" stroke="#00b894" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGreen)"/>
  <text x="300" y="292" class="edge-label" fill="#00b894">快照读</text>
  <!-- T3 -> v4 -->
  <polyline points="260,420 380,420 380,165 438,165" fill="none" stroke="#f57c00" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="285" y="412" class="edge-label" fill="#e65100">写入新版本</text>

  <!-- 图例 -->
  <line x1="70" y1="545" x2="100" y2="545" stroke="#00b894" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="108" y="550" class="legend-text">快照读：读取历史版本，不加锁</text>

  <line x1="390" y1="545" x2="420" y2="545" stroke="#f57c00" stroke-width="3"/>
  <text x="428" y="550" class="legend-text">写操作：生成新版本（当前读）</text>

  <line x1="700" y1="545" x2="730" y2="545" stroke="#8a94a6" stroke-width="3" marker-end="url(#arrowGray)"/>
  <text x="738" y="550" class="legend-text">版本链：DB_ROLL_PTR 串联</text>
</svg>
